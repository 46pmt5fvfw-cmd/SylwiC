<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Tracker Pro</title>
    <style>
        :root {
            --primary: #FF4757;
            --bg: #121214;
            --surface: #1E1E24;
            --surface-light: #2D2D35;
            --text: #FFFFFF;
            --text-muted: #8F8F9D;
            --accent: #2ED573;
            --border: #40404B;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 { margin: 0; font-size: 24px; font-weight: 700; }
        
        h2 { font-size: 20px; margin-top: 0; }

        .card {
            background-color: var(--surface);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid var(--border);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-secondary { background-color: var(--surface-light); }
        .btn-accent { background-color: var(--accent); color: black; }
        .btn-outline { background-color: transparent; border: 1px solid var(--border); color: var(--text); }

        .btn:active { opacity: 0.8; }

        input, select {
            background-color: var(--surface-light);
            color: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        .form-row { display: flex; gap: 10px; }
        .form-row input, .form-row select { margin-bottom: 0; }

        .exercise-item {
            background-color: var(--surface-light);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .exercise-name { font-size: 18px; font-weight: 600; }
        
        .muscle-badge {
            background-color: var(--primary);
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .set-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--surface);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .set-row span { color: var(--text-muted); }
        
        .set-row strong { font-size: 16px; color: var(--text); }

        .timer-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(18, 18, 20, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
        }

        .timer-display { font-size: 72px; font-weight: 700; margin-bottom: 30px; color: var(--accent); }

        .training-card {
            background-color: var(--surface-light);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 15px;
            cursor: pointer;
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .training-name { font-size: 18px; font-weight: 600; }

        .sets-controller {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .sets-controller button { width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--surface-light); color: var(--text); font-size: 18px; cursor: pointer; }

        .modal {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 80%;
            background: var(--bg);
            border-radius: 20px 20px 0 0;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            z-index: 500;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .modal.open { transform: translateY(0); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 400;
        }

        .modal-overlay.open { display: block; }

        .remove-btn { color: var(--primary); cursor: pointer; font-size: 14px; margin-top: 10px; display: block; }

    </style>
</head>
<body>

<audio id="timer-sound" src="https://assets.mixkit.co/sfx/preview/mixkit-alarm-digital-clock-beep-989.mp3"></audio>

<div class="container" id="app">
    <header>
        <h1>Gym Tracker Pro</h1>
    </header>

    <div id="view-home">
        <h2>Twoje Treningi</h2>
        <div id="trainings-list"></div>

        <button class="btn btn-secondary" onclick="openCreateTrainingModal()">+ Stwórz nowy trening</button>

        <h2 style="margin-top: 30px;">Ostatnie Sesje</h2>
        <div id="history-list"></div>
    </div>

    <div id="view-active-workout" style="display: none;">
        <h2 id="active-training-name">Trening</h2>
        <div id="active-exercises-list"></div>
        <button class="btn btn-accent" onclick="finishWorkout()">Zakończ Trening</button>
        <button class="btn btn-outline" style="margin-top: 10px;" onclick="cancelWorkout()">Anuluj</button>
    </div>

</div>

<div class="timer-overlay" id="timer-overlay">
    <div>Czas Odpoczynku</div>
    <div class="timer-display" id="timer-display">02:00</div>
    <button class="btn" style="width: 200px" onclick="stopTimerManually()">Pomiń</button>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal()"></div>
<div class="modal" id="training-modal">
    <h2 id="modal-title">Stwórz Trening</h2>
    <input type="text" id="new-training-name" placeholder="Nazwa treningu (np. Dół - Pośladki)">

    <h3>Wybierz ćwiczenia:</h3>
    <div id="exercises-selection-list"></div>

    <button class="btn btn-accent" onclick="saveNewTraining()">Zapisz Trening</button>
    <button class="btn btn-secondary" style="margin-top: 10px;" onclick="closeModal()">Anuluj</button>
</div>

<script>
    const baseExercises = [
        { id: 1, name: 'Hip Thrusty', muscle: 'Pośladki, Tył Ud', tips: 'Stopy na szerokość bioder, kolana szeroko. Zepnij pośladki w górze.' },
        { id: 2, name: 'Przysiad ze Sztangą', muscle: 'Uda, Pośladki', tips: 'Plecy proste, brzuch napięty. Schodź do kąta prostego.' },
        { id: 3, name: 'Wiosłowanie Sztangą', muscle: 'Plecy', tips: 'Tułów w opadzie, ściągaj łopatki przy przyciąganiu sztangi.' },
        { id: 4, name: 'Wyciskanie na Ławce', muscle: 'Klatka Piersiowa', tips: 'Ściągnij łopatki, kontroluj ciężar przy opuszczaniu.' },
        { id: 5, name: 'Uginanie Ramion z Hantlami', muscle: 'Biceps', tips: 'Łokcie przyklejone do tułowia, unikaj bujania.' },
        { id: 6, name: 'Plank', muscle: 'Brzuch', tips: 'Ciało w linii prostej, zepnij brzuch i pośladki.' }
    ];

    let workouts = JSON.parse(localStorage.getItem('gym_workouts')) || [];
    let history = JSON.parse(localStorage.getItem('gym_history')) || [];
    let activeWorkout = null;
    let timerInterval = null;
    let timerSeconds = 0;
    const timerSound = document.getElementById('timer-sound');

    function renderWorkouts() {
        const list = document.getElementById('trainings-list');
        list.innerHTML = '';

        if (workouts.length === 0) {
            list.innerHTML = '<p style="color: var(--text-muted)">Brak utworzonych treningów. Stwórz swój pierwszy!</p>';
            return;
        }

        workouts.forEach((workout, index) => {
            const div = document.createElement('div');
            div.className = 'training-card';
            div.innerHTML = `
                <div>
                    <div class="training-name">${workout.name}</div>
                    <div style="font-size: 12px; color: var(--text-muted); margin-top: 5px;">${workout.exercises.length} ćwiczeń</div>
                </div>
                <button class="btn btn-accent" style="width: auto;" onclick="startWorkout(${index})">Start</button>
            `;
            list.appendChild(div);
        });

        loadHistory();
    }

    function openCreateTrainingModal() {
        document.getElementById('modal-title').innerText = 'Stwórz Nowy Trening';
        document.getElementById('new-training-name').value = '';
        const exList = document.getElementById('exercises-selection-list');
        exList.innerHTML = '';

        baseExercises.forEach(ex => {
            const div = document.createElement('div');
            div.style.backgroundColor = 'var(--surface-light)';
            div.style.padding = '10px';
            div.style.borderRadius = '8px';
            div.style.marginBottom = '10px';
            div.style.display = 'flex';
            div.style.justifyContent = 'space-between';
            div.style.alignItems = 'center';
            div.innerHTML = `
                <div>${ex.name} <span style="font-size:11px; color:var(--text-muted)">(${ex.muscle})</span></div>
                <input type="checkbox" value="${ex.id}" style="margin:0; width:20px; height:20px;">
            `;
            exList.appendChild(div);
        });

        document.getElementById('training-modal').classList.add('open');
        document.getElementById('modal-overlay').classList.add('open');
    }

    function closeModal() {
        document.getElementById('training-modal').classList.remove('open');
        document.getElementById('modal-overlay').classList.remove('open');
    }

    function saveNewTraining() {
        const name = document.getElementById('new-training-name').value.trim();
        const selectedCheckboxes = document.querySelectorAll('#exercises-selection-list input:checked');

        if (!name) {
            alert('Wpisz nazwę treningu!');
            return;
        }
        if (selectedCheckboxes.length === 0) {
            alert('Wybierz przynajmniej jedno ćwiczenie!');
            return;
        }

        const selectedExercises = [];
        selectedCheckboxes.forEach(cb => {
            const exId = parseInt(cb.value);
            const ex = baseExercises.find(e => e.id === exId);
            selectedExercises.push({ ...ex, sets: [ { reps: 8, weight: 20 }, { reps: 8, weight: 20 }, { reps: 8, weight: 20 } ] });
        });

        workouts.push({ name: name, exercises: selectedExercises });
        localStorage.setItem('gym_workouts', JSON.stringify(workouts));

        closeModal();
        renderWorkouts();
    }

    function startWorkout(index) {
        activeWorkout = JSON.parse(JSON.stringify(workouts[index]));
        document.getElementById('view-home').style.display = 'none';
        document.getElementById('view-active-workout').style.display = 'block';

        document.getElementById('active-training-name').innerText = activeWorkout.name;

        renderActiveExercises();
    }

    function renderActiveExercises() {
        const container = document.getElementById('active-exercises-list');
        container.innerHTML = '';

        activeWorkout.exercises.forEach((ex, exIndex) => {
            const div = document.createElement('div');
            div.className = 'exercise-item';

            let setsHtml = '';
            ex.sets.forEach((set, setIndex) => {
                setsHtml += `
                    <div class="set-row">
                        <span>Seria ${setIndex + 1}</span>
                        <strong>${set.reps} powtórzeń × ${set.weight} kg</strong>
                    </div>
                `;
            });

            div.innerHTML = `
                <div class="exercise-header">
                    <div>
                        <div class="exercise-name">${ex.name}</div>
                        <div class="muscle-badge">${ex.muscle}</div>
                    </div>
                    <button class="btn btn-outline" style="width: auto; padding: 8px 15px;" onclick="addSet(${exIndex})">+ Seria</button>
                </div>
                <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 10px;">💡 Wskazówka: ${ex.tips}</div>
                <div>${setsHtml}</div>
                <button class="btn btn-accent" onclick="completeExerciseAndStartTimer(${exIndex})">WYKONANO</button>
                <span class="remove-btn" onclick="removeExercise(${exIndex})">Usuń ćwiczenie z tego treningu</span>
            `;
            container.appendChild(div);
        });
    }

    function addSet(exIndex) {
        const lastSet = activeWorkout.exercises[exIndex].sets[activeWorkout.exercises[exIndex].sets.length - 1];
        activeWorkout.exercises[exIndex].sets.push({ reps: lastSet.reps, weight: lastSet.weight });
        renderActiveExercises();
    }

    function removeExercise(exIndex) {
        if (confirm('Usunąć to ćwiczenie z treningu?')) {
            activeWorkout.exercises.splice(exIndex, 1);
            if(activeWorkout.exercises.length === 0) {
                alert('Musisz mieć przynajmniej jedno ćwiczenie w treningu!');
                activeWorkout.exercises.push(baseExercises[0]);
            }
            renderActiveExercises();
        }
    }

    function completeExerciseAndStartTimer(exIndex) {
        startTimer(120);
    }

    function startTimer(seconds) {
        timerSeconds = seconds;
        const display = document.getElementById('timer-display');
        document.getElementById('timer-overlay').style.display = 'flex';

        timerInterval = setInterval(() => {
            const minutes = Math.floor(timerSeconds / 60);
            const remainingSeconds = timerSeconds % 60;
            display.innerText = `${minutes.toString().padStart(2, '0')}:${remainingSeconds.toString().padStart(2, '0')}`;

            if (timerSeconds <= 0) {
                clearInterval(timerInterval);
                playTimerSoundAndClose();
            }
            timerSeconds--;
        }, 1000);
    }

    function stopTimerManually() {
        clearInterval(timerInterval);
        document.getElementById('timer-overlay').style.display = 'none';
        timerSound.pause();
        timerSound.currentTime = 0;
    }

    function playTimerSoundAndClose() {
        timerSound.play();
        setTimeout(stopTimerManually, 5000);
    }

    function finishWorkout() {
        const date = new Date().toLocaleDateString('pl-PL', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

        history.unshift({
            date: date,
            name: activeWorkout.name,
            exercises: activeWorkout.exercises
        });

        localStorage.setItem('gym_history', JSON.stringify(history));
        activeWorkout = null;

        document.getElementById('view-active-workout').style.display = 'none';
        document.getElementById('view-home').style.display = 'block';

        renderWorkouts();
    }

    function cancelWorkout() {
        if (confirm('Anulować trening? Twoje postępy nie zostaną zapisane.')) {
            activeWorkout = null;
            document.getElementById('view-active-workout').style.display = 'none';
            document.getElementById('view-home').style.display = 'block';
        }
    }

    function loadHistory() {
        const historyList = document.getElementById('history-list');
        historyList.innerHTML = '';

        if (history.length === 0) {
            historyList.innerHTML = '<p style="color: var(--text-muted)">Brak ukończonych treningów.</p>';
            return;
        }

        history.forEach(session => {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `
                <div style="font-size: 11px; text-transform: uppercase; color: var(--accent);">${session.date}</div>
                <div class="training-name" style="margin-bottom: 10px;">${session.name}</div>
            `;
            historyList.appendChild(div);
        });
    }

    renderWorkouts();
</script>

</body>
</html>
